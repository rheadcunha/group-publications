name: Update group publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # every Monday at 09:00 UTC; delete these two lines for manual runs only

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Retrieve PubMed and ORCID publications
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/build_publications.py

      - name: Save updated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publications-by-researcher.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update group publications"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
